version: "3.9"
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_USER=walknet
      - POSTGRES_PASSWORD=walknet
      - POSTGRES_DB=walknet
    ports: ["5432:5432"]
    volumes:
      - dbdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    env_file: ./backend/env
    depends_on: [db]
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    command: gunicorn -c gunicorn.conf.py wsgi:app
  frontend:
    image: node:20
    working_dir: /app
    env_file: ./frontend/.env
    volumes: ["./frontend:/app"]
    command: bash -lc "npm install && npm run dev -- --host"
    ports: ["5173:5173"]
volumes:
  dbdata:
