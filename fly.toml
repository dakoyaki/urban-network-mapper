# Fly.io configuration for Urban Network Mapper
# Deploy with: flyctl launch

app = "urban-network-mapper"
primary_region = "iad"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  PORT = "8000"
  FLASK_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000

[experimental]
  auto_rollback = true

