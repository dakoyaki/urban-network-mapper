services:
  - type: web
    name: urban-mapper-backend
    runtime: docker
    plan: standard
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/projects
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: urban-mapper-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false  # Set in Render dashboard
      - key: DEFAULT_PROJECT_EPSG
        value: 3857
    buildCommand: echo "Building backend..."
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app

databases:
  - name: urban-mapper-db
    plan: standard
    databaseName: urban_mapper
    user: urban_mapper_user
    postgresMajorVersion: 16

